[project]
name = "earthai"
version = "0.1.0"
description = "Satellite cloud GAN with latent-space exploration and animation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy",
    "pillow",
    "requests",
    "tqdm",
    "imageio[ffmpeg]",
    "scipy",
    "click",
]

[project.optional-dependencies]
stac = ["pystac-client", "planetary-computer", "rasterio"]
explore = ["gradio>=5"]
